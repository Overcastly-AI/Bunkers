# =================================================================================================
# catalog-join — every setting and its default.
#
# This file ships inside the jar and is always loaded first. Deployments pass only the files that
# change something (later files win), e.g.
#   java -jar catalog-join.jar run config/production.properties
# Values may reference environment variables as ${NAME} or ${NAME:default}.
# Keys under catalog.* and sim.* configure this application; every other key is passed to Kafka
# Streams (and its clients) unchanged.
# =================================================================================================

# ---- Kafka Streams ------------------------------------------------------------------------------
bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
application.id=catalog-join
processing.guarantee=exactly_once_v2
replication.factor=3
num.stream.threads=2
num.standby.replicas=1
state.dir=${CATALOG_STATE_DIR:/var/lib/catalog-join}
# Fewer, larger commits coalesce more intermediate join results before they are published.
commit.interval.ms=1000
statestore.cache.max.bytes=134217728
# Largest record the app may write (documents, aggregates, changelogs); keep all three equal to
# catalog.output.max-message-bytes. topic.* applies to the internal topics Kafka Streams creates.
producer.max.request.size=4194304
topic.max.message.bytes=4194304
# One upstream change can fan out to many documents (a manufacturer or location edit); give the
# exactly-once transaction room for that. Must not exceed the broker's transaction.max.timeout.ms.
producer.transaction.timeout.ms=120000
# Bounds RocksDB off-heap memory with catalog.rocksdb.* (below).
rocksdb.config.setter=com.motion.catalogjoin.BoundedRocksDb

# ---- topics -------------------------------------------------------------------------------------
# Prepended to every source and output topic below (internal topics are prefixed by application.id).
catalog.topic-prefix=

# Source topics (DB2 CDC) and their primary-key columns (= message key and partition key).
catalog.source.step_product_values.topic=topic.fsdb.step_product_values-json
catalog.source.step_product_values.key=STEP_PRODUCT_ID,STEP_ATTRIBUTE_ID,STEP_UNIT_ID,VALUE
# Key columns compared exactly instead of trimmed (VARCHAR, where trailing spaces are significant).
catalog.source.step_product_values.exact-key=VALUE
catalog.source.step_unit.topic=topic.fsdb.step_unit-json
catalog.source.step_unit.key=STEP_UNIT_ID
catalog.source.step_product.topic=topic.fsdb.step_product-json
catalog.source.step_product.key=STEP_PRODUCT_ID
catalog.source.step_product_classification.topic=topic.fsdb.step_product_classification-json
catalog.source.step_product_classification.key=STEP_PRODUCT_ID,STEP_CLASSIFICATION_ID
catalog.source.step_classification.topic=topic.fsdb.step_classification-json
catalog.source.step_classification.key=STEP_CLASSIFICATION_ID
catalog.source.item_profile.topic=topic.brop.item_profile-json
catalog.source.item_profile.key=ITEM_NO
catalog.source.mfr_profile.topic=topic.brop.mfr_profile-json
catalog.source.mfr_profile.key=MFR_CTL_NO
catalog.source.item_balance.topic=topic.brop.item_balance-json
catalog.source.item_balance.key=ITEM_NO,MI_LOC,STOREROOM_NO
catalog.source.location_profile.topic=topic.brop.location_profile-json
catalog.source.location_profile.key=MI_LOC
catalog.source.item_cost.topic=topic.brop.item_cost-json
catalog.source.item_cost.key=ITEM_NO,CORP_MI_LOC
catalog.source.non_cos_item_balance.topic=topic.brop.non_cos_item_balance-json
catalog.source.non_cos_item_balance.key=MI_LOC,ITEM_NO
catalog.source.local_cost.topic=topic.brop.local_cost-json
catalog.source.local_cost.key=MI_LOC,ITEM_NO,EFFECTIVE_DATE,EXPIRATION_DATE
catalog.source.item_restrict_rule.topic=topic.branch.item_restrict_rule-json
catalog.source.item_restrict_rule.key=CTL_NO
catalog.source.mfr_name.topic=topic.misearch.mfr_name-json
catalog.source.mfr_name.key=MFR_NAME_ID
catalog.source.item_price_cache.topic=topic.item.item_price_cache-json
catalog.source.item_price_cache.key=ITEM_NO,MI_LOC,CUSTOMER_NO

# Output topics (log-compacted) and the dead-letter topic. Partitions, replication and the size
# limit are used by `catalog-join create-topics`.
catalog.output.item=catalog.item
catalog.output.item-location=catalog.item-location
catalog.output.item-price=catalog.item-price
catalog.output.dead-letter=catalog.join.dlt
catalog.output.partitions=12
catalog.output.replication=3
catalog.output.max-message-bytes=4194304
catalog.output.dead-letter-retention-ms=1209600000

# Partition count for every internal repartition topic, which caps the app's parallelism. It keeps
# the app independent of source partition counts (sources can be repartitioned freely). Changing it
# after the first deploy needs a new application.id or an application reset. Empty = follow sources.
catalog.partitions=12

# ---- decoding -----------------------------------------------------------------------------------
# AVRO_OR_JSON | AVRO_ONLY | JSON_ONLY
catalog.payload-format=AVRO_OR_JSON
# Columns never taken from input (service-managed in the old system).
catalog.ingest.dropped-columns=LAST_EVENT_AT

# ---- join rules ---------------------------------------------------------------------------------
# STEP_ATTRIBUTE_IDs to project, by output name: catalog.step.attribute.<NAME>=<id>.
# ITEM_NUMBER is required: its value is the BROP ITEM_NO (the STEP-to-item bridge). The ids are
# environment specific, so there are no defaults here.
#catalog.step.attribute.ITEM_NUMBER=
#catalog.step.attribute.MANUFACTURER_PART_NO=
#catalog.step.attribute.SHORT_DESC=
#catalog.step.attribute.PRIMARY_IMAGE=
#catalog.step.attribute.UPC_NO=
#catalog.step.attribute.SHIPPING_WEIGHT=

# PARENT_STEP_CLASSIFICATION_ID at the top of the web hierarchy.
catalog.step.classification-root=Motion

# dcStock = balances at locations with one of these LOCATION_TYPE and OPEN_CLOSED values.
catalog.dc-stock.location-types=W
catalog.dc-stock.location-statuses=O
# MFR_PROFILE.SELLABLE values whose items get no dcStock (the old anti-join). Empty = keep all.
catalog.dc-stock.exclude-sellable=N

# ---- runtime ------------------------------------------------------------------------------------
# GET /health/live (process healthy) and /health/ready (processing). 0 disables the endpoint.
catalog.health-port=8080
# How long a shutdown may take to commit and close; keep below the pod's termination grace period.
catalog.shutdown-timeout-ms=60000
# Off-heap memory shared by all RocksDB stores in the process (block cache + memtables), and the
# share of it that memtables may use. Size the container as heap + this + ~25% headroom.
catalog.rocksdb.memory-bytes=1073741824
catalog.rocksdb.memtable-share=0.5

# ---- Datadog APM --------------------------------------------------------------------------------
# dd.* keys configure the Datadog Java agent, which bin/catalog-join attaches at JVM start when
# dd.trace.enabled=true (from these merged settings, like everything else). Kafka Streams, producer
# and consumer spans are automatic; trace context and Data Streams Monitoring pathways travel in
# record headers, so traces continue into consumers of the output topics. The app adds catalog.*
# span tags (table, key, dead-letter errors, published vs unchanged documents).
dd.trace.enabled=false
dd.service=catalog-join
dd.env=${DD_ENV:local}
dd.version=${DD_VERSION:dev}
dd.agent.host=${DD_AGENT_HOST:localhost}
dd.trace.agent.port=8126
dd.data.streams.enabled=true
dd.logs.injection=true
# Lets the app's OpenTelemetry API calls (span tags) reach the Datadog spans.
dd.trace.otel.enabled=true
# Report Kafka spans under dd.service rather than a generic "kafka" service.
dd.trace.remove.integration-service-names.enabled=true

# ---- load simulator (sim-generate / sim-verify) -------------------------------------------------
sim.seed=42
sim.items=10000
sim.locations=600
sim.prices-per-item=2
# Last churn round generated / verified (round 0 = initial load).
sim.rounds=3
sim.from-round=0
sim.formats=flat=70,envelope=20,avro=10
sim.pad-share=0.1
# Max messages per second (0 = unlimited).
sim.rate=0
# Partitions and replication for source topics created by sim-generate --create-topics.
sim.source-partitions=6
sim.source-replication=1
# Check every Nth item (1 = all).
sim.sample-every=1
sim.settle-timeout-s=3600
