# Example deployment. A StatefulSet keeps each instance's RocksDB state on its own volume, so a
# restart resumes instead of rebuilding state from the changelog topics.
apiVersion: v1
kind: Service
metadata:
  name: catalog-join
  labels: {app: catalog-join}
spec:
  clusterIP: None
  selector: {app: catalog-join}
  ports:
    - {name: health, port: 8080}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: catalog-join
spec:
  serviceName: catalog-join
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: catalog-join}
  template:
    metadata:
      labels: {app: catalog-join}
    spec:
      terminationGracePeriodSeconds: 90
      containers:
        - name: catalog-join
          image: catalog-join:latest
          ports:
            - {name: health, containerPort: 8080}
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: STEP_ATTR_ITEM_NUMBER
              value: "CHANGE-ME"
          volumeMounts:
            - {name: state, mountPath: /var/lib/catalog-join}
          readinessProbe:
            httpGet: {path: /health, port: health}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: health}
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: "1", memory: 4Gi}
            limits: {memory: 4Gi}
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 50Gi}
