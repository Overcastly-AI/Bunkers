# ---- Kafka Streams (anything not under catalog.* is passed to Kafka Streams as-is) ----
application.id=catalog-join
bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
processing.guarantee=exactly_once_v2
replication.factor=3
num.stream.threads=2
state.dir=/var/lib/catalog-join
# Fewer, larger commits coalesce more intermediate join results before they are published.
commit.interval.ms=1000
statestore.cache.max.bytes=134217728
# Keep a warm copy of state on another instance for fast failover.
num.standby.replicas=1

# Security (example for SASL/SCRAM; delete if not used)
#security.protocol=SASL_SSL
#sasl.mechanism=SCRAM-SHA-512
#sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";

# ---- catalog-join ----
catalog.payload-format=AVRO_OR_JSON

# STEP_ATTRIBUTE_IDs to project, by output name. ITEM_NUMBER is required: it bridges STEP to ITEM_NO.
catalog.step.attribute.ITEM_NUMBER=${STEP_ATTR_ITEM_NUMBER}
catalog.step.attribute.MANUFACTURER_PART_NO=${STEP_ATTR_MANUFACTURER_PART_NO:}
catalog.step.attribute.SHORT_DESC=${STEP_ATTR_SHORT_DESC:}
catalog.step.attribute.PRIMARY_IMAGE=${STEP_ATTR_PRIMARY_IMAGE:}
catalog.step.attribute.UPC_NO=${STEP_ATTR_UPC_NO:}
catalog.step.attribute.SHIPPING_WEIGHT=${STEP_ATTR_SHIPPING_WEIGHT:}
catalog.step.classification-root=Motion

catalog.output.item=catalog.item
catalog.output.item-location=catalog.item-location
catalog.output.item-price=catalog.item-price
catalog.output.dead-letter=catalog.join.dlt

# Partition count for the canonical repartition topics (leave unset to follow the source topics).
#catalog.partitions=12

catalog.health-port=8080

# Source topic overrides, e.g.:
#catalog.topic.item_profile=topic.brop.item_profile-json
