# catalog-join configured for the simulator: sim.* topics, separate application.id, simulator's
# STEP attribute ids (output of `SimMain app-config --topic-prefix sim.`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-join-sim
data:
  application.properties: |
    application.id=catalog-join-sim
    bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
    processing.guarantee=exactly_once_v2
    replication.factor=3
    num.stream.threads=2
    state.dir=/var/lib/catalog-join
    commit.interval.ms=1000
    statestore.cache.max.bytes=134217728
    catalog.health-port=8080
    catalog.step.attribute.ITEM_NUMBER=SIM_ITEM
    catalog.step.attribute.MANUFACTURER_PART_NO=SIM_MPN
    catalog.step.attribute.SHORT_DESC=SIM_DESC
    catalog.step.attribute.PRIMARY_IMAGE=SIM_IMG
    catalog.step.attribute.UPC_NO=SIM_UPC
    catalog.step.attribute.SHIPPING_WEIGHT=SIM_WEIGHT
    catalog.topic.step_product_values=sim.topic.fsdb.step_product_values-json
    catalog.topic.step_unit=sim.topic.fsdb.step_unit-json
    catalog.topic.step_product=sim.topic.fsdb.step_product-json
    catalog.topic.step_product_classification=sim.topic.fsdb.step_product_classification-json
    catalog.topic.step_classification=sim.topic.fsdb.step_classification-json
    catalog.topic.item_profile=sim.topic.brop.item_profile-json
    catalog.topic.mfr_profile=sim.topic.brop.mfr_profile-json
    catalog.topic.item_balance=sim.topic.brop.item_balance-json
    catalog.topic.location_profile=sim.topic.brop.location_profile-json
    catalog.topic.item_cost=sim.topic.brop.item_cost-json
    catalog.topic.non_cos_item_balance=sim.topic.brop.non_cos_item_balance-json
    catalog.topic.local_cost=sim.topic.brop.local_cost-json
    catalog.topic.item_restrict_rule=sim.topic.branch.item_restrict_rule-json
    catalog.topic.mfr_name=sim.topic.misearch.mfr_name-json
    catalog.topic.item_price_cache=sim.topic.item.item_price_cache-json
    catalog.output.item=sim.catalog.item
    catalog.output.item-location=sim.catalog.item-location
    catalog.output.item-price=sim.catalog.item-price
    catalog.output.dead-letter=sim.catalog.join.dlt
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: catalog-join-sim
spec:
  serviceName: catalog-join-sim
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: catalog-join-sim}
  template:
    metadata:
      labels: {app: catalog-join-sim}
    spec:
      terminationGracePeriodSeconds: 90
      containers:
        - name: catalog-join
          image: catalog-join:latest
          env:
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: "kafka:9092"}
            - {name: CATALOG_CONFIG, value: /etc/catalog-join-sim/application.properties}
          volumeMounts:
            - {name: config, mountPath: /etc/catalog-join-sim}
            - {name: state, mountPath: /var/lib/catalog-join}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
          resources:
            requests: {cpu: "2", memory: 4Gi}
            limits: {memory: 4Gi}
      volumes:
        - name: config
          configMap: {name: catalog-join-sim}
  volumeClaimTemplates:
    - metadata: {name: state}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: premium-rwo
        resources:
          requests: {storage: 100Gi}
