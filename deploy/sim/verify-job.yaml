apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-join-sim-verify
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: verify
          image: catalog-join:latest
          command: ["java", "-XX:MaxRAMPercentage=75", "-cp", "/app/catalog-join.jar", "com.motion.catalogjoin.sim.SimMain"]
          args:
            - verify
            - --bootstrap=$(KAFKA_BOOTSTRAP_SERVERS)
            - --topic-prefix=sim.
            - --items=1000000
            - --rounds=3
            - --app-id=catalog-join-sim
            - --sample-every=100
            - --settle-timeout-s=14400
          env:
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: "kafka:9092"}
          resources:
            requests: {cpu: "1", memory: 4Gi}
            limits: {memory: 4Gi}
