apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-join-sim-generate
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: generate
          image: catalog-join:latest
          command: ["java", "-XX:MaxRAMPercentage=75", "-cp", "/app/catalog-join.jar", "com.motion.catalogjoin.sim.SimMain"]
          args:
            - generate
            - --bootstrap=$(KAFKA_BOOTSTRAP_SERVERS)
            - --topic-prefix=sim.
            - --items=1000000
            - --rounds=3
            - --create-topics
            - --partitions=12
            - --replication=3
          env:
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: "kafka:9092"}
          resources:
            requests: {cpu: "2", memory: 2Gi}
            limits: {memory: 2Gi}
