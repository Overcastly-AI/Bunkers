# Load simulation: a separate application on sim.* topics, with the simulator's STEP attribute ids.
# Used by deploy/sim (GKE), sim/run-local.sh and SimulationTest.
application.id=catalog-join-sim
catalog.topic-prefix=sim.
catalog.step.attribute.ITEM_NUMBER=SIM_ITEM
catalog.step.attribute.MANUFACTURER_PART_NO=SIM_MPN
catalog.step.attribute.SHORT_DESC=SIM_DESC
catalog.step.attribute.PRIMARY_IMAGE=SIM_IMG
catalog.step.attribute.UPC_NO=SIM_UPC
catalog.step.attribute.SHIPPING_WEIGHT=SIM_WEIGHT

bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:CHANGE-ME:9092}
catalog.partitions=12

# ~30 source records per item at round 0, plus ~10% per churn round: 1M items = 30M+ records.
sim.items=1000000
sim.rounds=3
sim.source-partitions=12
sim.source-replication=3
sim.sample-every=100
sim.settle-timeout-s=14400
