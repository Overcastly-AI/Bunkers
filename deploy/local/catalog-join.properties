# Single-broker local runs (sim/run-local.sh), layered after deploy/sim/catalog-join.properties.
bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
replication.factor=1
num.standby.replicas=0
state.dir=${CATALOG_STATE_DIR:/tmp/catalog-join}
catalog.partitions=6
catalog.output.partitions=6
catalog.output.replication=1
catalog.rocksdb.memory-bytes=268435456
sim.items=20000
sim.source-partitions=6
sim.source-replication=1
sim.sample-every=1
sim.settle-timeout-s=3600
