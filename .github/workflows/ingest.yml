name: ingest

# Applies db/ingest/*.sql to the live register database and runs its verify
# suite. Runs here because the build container has no route to the database
# (egress allows only GitHub and package registries) and because shuttling a
# megabyte of exact-identity SQL through an LLM's context to re-emit it into
# API calls is a fidelity risk this register should refuse on principle: the
# load uses deterministic UUIDs, and a single silently mangled character would
# corrupt an identity rather than fail loudly.
#
# The SQL itself was validated end to end before this workflow existed: the
# generating agent applied supabase/schema.sql to a scratch PostgreSQL from
# empty, loaded all 20 chunks, ran the verify suite green, re-applied
# everything, and verified again (idempotency). What runs here is the same
# text against the live project.
#
# Requires the SUPABASE_DB_URL repository secret: the session-pooler
# connection URI from the Supabase dashboard (Connect → Session pooler).

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ingest.yml"
      - "db/ingest/sweep-01.sql"

  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Apply sweep-01 and verify
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL is not set. Supabase dashboard → Connect → Session pooler URI → repo Settings → Secrets → Actions."
            exit 1
          fi

          # Split the chunked load exactly as authored.
          python3 - <<'PY'
          import re, pathlib
          s = pathlib.Path('db/ingest/sweep-01.sql').read_text()
          parts = re.split(r'-- CHUNK (\d+)/20 --', s)
          out = pathlib.Path('chunks'); out.mkdir(exist_ok=True)
          for i in range(1, len(parts), 2):
              (out / f"chunk-{int(parts[i]):02d}.sql").write_text(parts[i+1].strip())
          print(f"{(len(parts)-1)//2} chunks")
          PY

          # Each chunk in its own transaction, stop on first error. Idempotent
          # by construction, so a failed run is safely re-runnable.
          for f in chunks/chunk-*.sql; do
            echo "== applying $f"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -q -f "$f"
          done

          echo "== verify"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f db/ingest/sweep-01-verify.sql | tee verify-out.txt

          {
            echo "### Sweep-01 ingest"
            echo ""
            echo '```'
            tail -40 verify-out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
